<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detector</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: #f4f7fb;
        color: #182230;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, #dbeafe 0, transparent 38%),
          linear-gradient(135deg, #f8fafc, #eef2ff);
      }

      main {
        width: min(760px, calc(100% - 32px));
        padding: 48px;
        border: 1px solid #dbe3ef;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 70px rgba(35, 55, 90, 0.14);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #3457d5;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: clamp(32px, 6vw, 50px); }

      .intro {
        margin: 14px 0 28px;
        color: #526174;
        font-size: 17px;
        line-height: 1.55;
      }

      label { display: block; margin-bottom: 9px; font-weight: 700; }

      textarea {
        width: 100%;
        min-height: 128px;
        padding: 16px;
        resize: vertical;
        border: 1px solid #bcc9da;
        border-radius: 12px;
        font: inherit;
        line-height: 1.5;
      }

      textarea:focus {
        outline: 3px solid rgba(52, 87, 213, 0.18);
        border-color: #3457d5;
      }

      button {
        margin-top: 16px;
        padding: 12px 22px;
        border: 0;
        border-radius: 10px;
        background: #3457d5;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover { background: #2946ad; }

      #result {
        min-height: 58px;
        margin-top: 24px;
        padding: 16px 18px;
        border-left: 4px solid #3457d5;
        border-radius: 8px;
        background: #eef4ff;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">IBM AI Engineering Project</p>
      <h1>Emotion Detector</h1>
      <p class="intro">
        Enter an English sentence to identify its emotion scores and dominant emotion.
      </p>

      <label for="textToAnalyze">Text to analyze</label>
      <textarea id="textToAnalyze" placeholder="For example: I am glad this happened.">{{ initial_text|default('', true) }}</textarea>
      <button id="analyzeButton" type="button">Analyze emotion</button>

      <div id="result" role="status" aria-live="polite">
        {{ initial_result|default('Your analysis result will appear here.', true) }}
      </div>
    </main>

    <script>
      const textInput = document.getElementById("textToAnalyze");
      const result = document.getElementById("result");

      document.getElementById("analyzeButton").addEventListener("click", async () => {
        result.textContent = "Analyzing…";
        const query = new URLSearchParams({ textToAnalyze: textInput.value });

        try {
          const response = await fetch(`/emotionDetector?${query}`);
          result.textContent = await response.text();
        } catch (error) {
          result.textContent = `Unable to analyze the text: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
